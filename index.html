T('og',0,'esd','Emergency Shutdown Valve (ESD / API 6D)','صمام الإغلاق الطارئ (ESD / API 6D)','valve_esd_api6d.glb','esd',{},
'The ESD valve is the main safety shield of oil facilities. It stays fully open in normal operation and closes completely in under 5 seconds when fire, gas leak or pipe rupture is detected, driven by a pneumatic/hydraulic actuator with a fail-safe return spring.',

/* ============ Calculation families ============ */
const sel=v=>v;
const FM={
affinity:{i:p=>[['Speed N','rpm',0,Math.round(p.N0*1.4),p.N0,10],['Suction pressure P_in','bar',0,10,1,.1]],f:(v,p)=>{const r=v[0]/p.N0,dp=p.dP*r*r;return[['ΔP = ΔP₀(N/N₀)²',dp,'bar'],['P_out',v[1]+dp,'bar'],['Flow Q ∝ N',p.Q*r,'m³/h'],['Power ∝ N³',p.P*r**3,'kW'],['Head (water)',dp*10.2,'m']]},w:v=>v[1]<.5?'Low suction: cavitation risk':''},
pd:{i:p=>[['Speed N','rpm',10,Math.round(p.N0*2),p.N0,10],['Δp','bar',1,300,50,1]],f:(v,p)=>{const Q=p.V*v[0]*p.ev/1000,Ph=Q*v[1]/600,Ps=Ph/(p.ev*p.em);return[['Flow Q = Vd·N·ηv',Q,'L/min'],['Hydraulic power',Ph,'kW'],['Shaft power',Ps,'kW'],['Torque',v[0]?Ps*9549/v[0]:0,'N·m']]},w:()=>''},
comp:{i:p=>[['Pressure ratio r','',1,12,4,.1],['Inlet T₁','°C',-20,60,20,1]],f:(v,p)=>{const T1=v[1]+273.15,e=(p.k-1)/p.k,ws=p.k/(p.k-1)*.287*T1*(v[0]**e-1);return[['T₂ (isentropic)',T1*v[0]**e-273.15,'°C'],['Isentropic work',ws,'kJ/kg'],['Actual work (÷η)',ws/p.eta,'kJ/kg'],['T₂ actual',T1+ws/p.eta/1.005-273.15,'°C']]},w:(v,p)=>v[0]>8?'High ratio: use staging/intercooling':''},
valve:{i:p=>[['Opening x','%',0,100,100,1],['Δp','bar',0,20,2,.1]],f:(v,p)=>{const x=v[0]/100,R=50,cv=p.c==='lin'?p.Cv*x:p.c==='eq'?(x?p.Cv*R**(x-1):0):p.Cv*Math.sqrt(x),open=v[1]>=p.crack&&x>0,Q=open?.865*cv*Math.sqrt(v[1]):0;return[['Cv at position',cv,''],['Flow Q = 0.865·Cv√Δp',Q,'m³/h'],['State',open?'OPEN':'CLOSED / below cracking','']]},w:()=>''},
relief:{i:p=>[['System pressure','bar',0,30,8,.1],['Set pressure','bar',1,25,10,.1]],f:(v,p)=>{const op=(v[0]-v[1])/v[1]*100,lift=v[0]<v[1]?0:p.pop?100:Math.min(100,op/10*100);return[['Overpressure',Math.max(op,0),'%'],['Valve lift',lift,'%'],['State',lift?(p.pop?'POPPED OPEN':'MODULATING'):'CLOSED','']]},w:v=>v[0]>v[1]*1.1?'Overpressure above 10%':''},
choke:{i:p=>[['Bean size S','/64 in',8,64,32,1],['Oil rate q','stb/d',100,5000,1500,50]],f:(v,p)=>{const P=435*p.GLR**.546*v[1]/v[0]**1.89;return[['P_wh (Gilbert)',P,'psia'],['P_wh',P/14.504,'bar']]},w:()=>''},
esd:{i:p=>[['Stroke L','mm',50,600,250,10],['Closing speed','mm/s',20,400,100,5]],f:v=>{const tc=v[0]/v[1];return[['Closing time',tc,'s'],['API/Plant target ≤ 5 s',tc<=5?'PASS':'FAIL','']]},w:v=>v[0]/v[1]>5?'Closing time exceeds 5 s':''}};
/* ============ Palette (professional) ============ */
const BG=['#000000','#0b1220','#111827','#1e293b','#0f2a3d','#102a22','#2a1f3d','#3a3a3a','#64748b','#cbd5e1','#e2e8f0','#f8fafc'];
const MC=['#94a3b8','#64748b','#475569','#1d4ed8','#0ea5e9','#06b6d4','#0d9488','#15803d','#84cc16','#eab308','#f59e0b','#ea580c','#dc2626','#be185d','#7c3aed','#b8860b','#c0c0c0','#2b2b2b'];
/* ============ Router / views ============ */
const $=id=>document.getElementById(id),nm=o=>L==='ar'?o.ar:o.en;
function go(h){location.hash='#/'+h}
window.onhashchange=render;
function render(){const p=location.hash.replace('#/','').split('/'),A=$('app');stopSim();let c=`<a onclick="go('')">${t('home')}</a>`;
if(!p[0]){$('crumb').innerHTML=c;A.innerHTML=`<h2 class="pg">${t('pick')}</h2><div class="cards">${Object.entries(EQ).map(([k,e])=>`<div class="card" onclick="go('${k}')"><div class="ic">${e.ic}</div><h3>${nm(e)}</h3><p>${L==='ar'?e.d[1]:e.d[0]}</p></div>`).join('')}</div>`;return}

if(!p[1]){$('crumb').innerHTML=c+` › ${nm(e)}`;A.innerHTML=`<h2 class="pg">${nm(e)} — ${t('cats')}</h2>`+e.g.map((g,i)=>`<div class="grp"><h4>${L==='ar'?g[1]:g[0]}</h4>${D.filter(d=>d.eq===p[0]&&d.g===i).map(d=>`<div class="row" onclick="go('${p[0]}/${d.id}/0')"><div>${nm(d)}</div><span>›</span></div>`).join('')}</div>`).join('');typeset();return}
const d=D.find(x=>x.id===p[1]),tab=+p[2]||0,ar=L==='ar'&&d.x;
$('crumb').innerHTML=c+` › <a onclick="go('${p[0]}')">${nm(e)}</a> › ${nm(d)}`;
const tabs=`<div class="tabs">${t('tabs').map((n,i)=>`<button class="tab ${i==4?'simt ':''}${i==tab?'on':''}" onclick="go('${p[0]}/${d.id}/${i}')">${n}</button>`).join('')}</div>`;
const li=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;let body='';
if(tab==0)body=`<div class="panel"><h3>${nm(d)}</h3><p>${ar&&d.x.s||d.s}</p></div>`;
if(tab==1)body=`<div class="panel"><h3>${t('tabs')[1]}</h3><p>${ar&&d.x.o||d.o}</p></div>`;
if(tab==2)body=`<div class="panel"><h3>${t('tabs')[2]}</h3>${d.l.map(x=>`<div class="eq">${x}</div>`).join('')}</div>`;
if(tab==3)body=`<div class="panel"><h3>${t('tabs')[3]}</h3>${li(ar&&d.x.a||d.a)}</div>`;
if(tab==4){body=simHTML(d)}
A.innerHTML=`<h2 class="pg">${nm(d)}</h2>${tabs}${body}`;if(tab==4)startSim(d);typeset()}
function typeset(){window.MathJax&&MathJax.typesetPromise&&MathJax.typesetPromise()}
function lang(){L=L==='en'?'ar':'en';$('root').lang=L;$('root').dir=L==='ar'?'rtl':'ltr';$('lg').textContent=L==='ar'?'English':'العربية';document.querySelectorAll('[data-t]').forEach(n=>n.textContent=t(n.dataset.t));render()}
/* ============ Simulation view ============ */
let ren,scn,cam,ctl,mixer,model,raf,cur,mats=[],clock=new THREE.Clock();
function simHTML(d){const f=FM[d.fam],ins=f.i(d.p);return`<div class="sim"><div id="view"><div id="cv"></div><div id="msg"></div>
<button class="btn edit" onclick="$('ed').classList.toggle('open')">✎ ${t('edit')}</button>
<div id="ed"><h5>${t('bg')}</h5><div class="sw">${BG.map(c=>`<i style="background:${c}" onclick="setBg('${c}')"></i>`).join('')}</div><h5>${t('mdl')}</h5><div class="sw">${MC.map(c=>`<i style="background:${c}" onclick="setMc('${c}')"></i>`).join('')}</div><h5>${t('op')}</h5><input type="range" min=".1" max="1" step=".05" value="1" oninput="setOp(this.value)"><br><br><button class="btn" onclick="setMc(null)">${t('reset')}</button></div></div>
<div><div class="box"><h5>${t('ctl')}</h5>${ins.map((x,i)=>`<div class="in"><div><label>${x[0]} (${x[1]})</label><input type="number" id="n${i}" value="${x[4]}" step="${x[5]}" oninput="sy(${i},'n')"></div><input type="range" id="s${i}" min="${x[2]}" max="${x[3]}" step="${x[5]}" value="${x[4]}" oninput="sy(${i},'s')"></div>`).join('')}<div id="wn" class="o"><b class="w"></b></div></div>
<div class="box"><h5>${t('res')}</h5><div id="out"></div></div>
<div class="box"><h5>${t('file')}</h5><code style="color:var(--ye)">${d.file}</code></div></div></div>`}
function sy(i,s){const n=$('n'+i),r=$('s'+i);if(s==='n')r.value=n.value;else n.value=r.value;calc()}
function calc(){const d=cur,f=FM[d.fam],ins=f.i(d.p),v=ins.map((_,i)=>parseFloat($('n'+i).value)||0);
$('out').innerHTML=f.f(v,d.p).map(r=>`<div class="o"><span>${r[0]}</span><b>${typeof r[1]==='number'?r[1].toFixed(2):r[1]} ${r[2]}</b></div>`).join('');$('wn').firstChild.textContent=f.w(v,d.p)?'⚠ '+f.w(v,d.p):'';
if(mixer)mixer.timeScale=(d.fam==='affinity'||d.fam==='pd')?Math.max(v[0]/ins[0][4],.05):1}
function startSim(d){cur=d;const c=$('cv');scn=new THREE.Scene();scn.background=new THREE.Color('#000');cam=new THREE.PerspectiveCamera(45,c.clientWidth/c.clientHeight,.1,200);cam.position.set(-3,2,4);
ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(c.clientWidth,c.clientHeight);ren.outputEncoding=THREE.sRGBEncoding;c.appendChild(ren.domElement);ctl=new THREE.OrbitControls(cam,ren.domElement);ctl.enableDamping=true;
scn.add(new THREE.AmbientLight(0xffffff,1.4));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(5,10,5);scn.add(dl);calc();
$('msg').textContent='Loading '+d.file+' …';
new THREE.GLTFLoader().load(d.file,g=>{model=g.scene;const b=new THREE.Box3().setFromObject(model),s=b.getSize(new THREE.Vector3()),m=Math.max(s.x,s.y,s.z)||1,k=3/m;model.scale.setScalar(k);model.position.sub(b.getCenter(new THREE.Vector3()).multiplyScalar(k));scn.add(model);mats=[];
model.traverse(o=>{if(o.isMesh)(Array.isArray(o.material)?o.material:[o.material]).forEach(x=>{x.userData.c=x.color&&x.color.clone();x.userData.o=x.opacity;x.userData.t=x.transparent;mats.push(x)})});
if(g.animations.length){mixer=new THREE.AnimationMixer(model);g.animations.forEach(a=>mixer.clipAction(a).play())}$('msg').textContent='';calc()},undefined,()=>{$('msg').innerHTML=`${t('need')}<br><b>${d.file}</b>`});
const loop=()=>{raf=requestAnimationFrame(loop);ctl.update();if(mixer)mixer.update(clock.getDelta());ren.render(scn,cam)};loop()}
function stopSim(){cancelAnimationFrame(raf);if(ren){ren.dispose();ren=null}mixer=null;model=null}
const setBg=c=>scn.background=new THREE.Color(c);
const setMc=c=>mats.forEach(m=>{if(!m.color)return;c?m.color.set(c):m.color.copy(m.userData.c)});
const setOp=v=>mats.forEach(m=>{if(m.userData.o===undefined)return;m.transparent=v<1||m.userData.t;m.opacity=Math.min(v,m.userData.o);m.needsUpdate=true});
window.onresize=()=>{if(ren){const c=$('cv');cam.aspect=c.clientWidth/c.clientHeight;cam.updateProjectionMatrix();ren.setSize(c.clientWidth,c.clientHeight)}};
document.querySelectorAll('[data-t]').forEach(n=>n.textContent=t(n.dataset.t));render();
</script></body></html>
