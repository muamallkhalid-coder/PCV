<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* =====================================================================
   ENGINEERING DESIGN  -  data-driven section (data.json -> vertical blocks)
   Add a model: upload the .glb, add one entry to data.json. No code edits.
   ===================================================================== */
const ED=(()=>{
/* ---- CONFIG: the only two lines you may ever need to change ---------
   dataUrl     : 'data.json' (same GitHub Pages folder as this page)
                 or 'https://raw.githubusercontent.com/OWNER/REPO/main/data.json'
   modelsBase  : '' (models sit next to index.html)
                 or 'https://raw.githubusercontent.com/OWNER/REPO/main/models/'
   ------------------------------------------------------------------- */
const CFG={dataUrl:'data.json',modelsBase:''};

const SECTIONS=[
 {id:'fluid-dynamics',
  title:{en:'Fluid Dynamics',ar:'ديناميكا الموائع'},
  desc:{en:'Flow behaviour inside pumps, compressors and valves: pressure gradients, velocity fields and viscous effects.',ar:'سلوك الجريان داخل المضخات والضواغط والصمامات: تدرجات الضغط ومجالات السرعة وتأثيرات اللزوجة.'}},
 {id:'exploded-view',
  title:{en:'Interactive Exploded View',ar:'المنظر المفكّك التفاعلي'},
  desc:{en:'Take each device apart, part by part, and inspect how the assembly fits together.',ar:'فكّ كل جهاز قطعةً قطعة وافحص كيفية تجميع أجزائه.'}}
];
const ALIAS={'fluid':'fluid-dynamics','fluid-dynamics':'fluid-dynamics','exploded':'exploded-view','exploded-view':'exploded-view','interactive-exploded-view':'exploded-view'};

const S={
en:{title:'Engineering Design',sub:'Fluid simulations and interactive exploded views of pumps, compressors and valves, loaded live from the model library.',cardDesc:'Fluid motion simulations and interactive exploded views.',
 loadingData:'Loading models…',loadingModel:'Loading model…',retry:'Retry',reset:'Reset view',rotate:'Auto-rotate',play:'Animation',fs:'Fullscreen',
 hintMouse:'Click the model, then scroll to zoom',hintTouch:'Tap the model to interact',done:'Done',
 missing:'Model file not found. Upload it to the GitHub repository next to data.json:',noengine:'The 3D engine failed to load. Check your connection and reload.',
 dataFail:'Couldn’t load data.json.',dataHelp:'Check that the file exists in the repository and contains valid JSON. Opening index.html straight from disk also blocks this request; use a web server or GitHub Pages.',
 empty:'No models here yet. Add an entry to data.json and it will appear automatically.',skipped:'Some entries in data.json were skipped:'},
ar:{title:'التصميم الهندسي',sub:'محاكاة حركة الموائع ومناظر مفكّكة تفاعلية للمضخات والضواغط والصمامات، تُحمَّل مباشرةً من مكتبة النماذج.',cardDesc:'محاكاة حركة الموائع ومناظر مفكّكة تفاعلية.',
 loadingData:'جارٍ تحميل النماذج…',loadingModel:'جارٍ تحميل النموذج…',retry:'إعادة المحاولة',reset:'إعادة الضبط',rotate:'دوران تلقائي',play:'الحركة',fs:'ملء الشاشة',
 hintMouse:'انقر على النموذج ثم مرّر العجلة للتكبير',hintTouch:'المس النموذج للتفاعل معه',done:'تم',
 missing:'ملف النموذج غير موجود. ارفعه إلى مستودع GitHub بجانب data.json:',noengine:'تعذّر تحميل محرك العرض ثلاثي الأبعاد. تحقق من الاتصال وأعد تحميل الصفحة.',
 dataFail:'تعذّر تحميل data.json.',dataHelp:'تأكد من وجود الملف في المستودع ومن صحة صيغة JSON. فتح index.html مباشرةً من القرص يمنع هذا الطلب أيضاً؛ استخدم خادم ويب أو GitHub Pages.',
 empty:'لا توجد نماذج هنا بعد. أضف عنصراً إلى data.json وسيظهر تلقائياً.',skipped:'تم تخطي بعض العناصر في data.json:'}
};
const s=k=>(S[L]&&S[L][k])||S.en[k];
const count=n=>L==='ar'?n+' نموذج':n+(n===1?' model':' models');
const pick=v=>{if(v==null)return'';if(typeof v==='string')return v;if(typeof v!=='object')return String(v);return v[L]||v.en||Object.values(v).find(x=>typeof x==='string')||''};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=x=>String(x||'').trim().toLowerCase().replace(/[\s_]+/g,'-');
const modelUrl=m=>/^https?:\/\//i.test(m)?m:CFG.modelsBase+m.split('/').map(encodeURIComponent).join('/');
const coarse=()=>window.matchMedia&&matchMedia('(pointer:coarse)').matches;

/* ---- data ---------------------------------------------------------- */
let dataP=null;
function load(){
 if(!dataP)dataP=fetch(CFG.dataUrl,{cache:'no-cache'})
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status+' ('+CFG.dataUrl+')');return r.json()})
  .then(normalize);
 return dataP;
}
function normalize(raw){
 const list=Array.isArray(raw)?raw:raw&&raw.items;
 if(!Array.isArray(list))throw new Error('data.json must be an array, or an object with an "items" array.');
 const items=[],skipped=[];
 list.forEach((it,n)=>{
  const tag='#'+(n+1);
  if(!it||typeof it!=='object')return skipped.push(tag+': not an object');
  if(typeof it.model!=='string'||!it.model.trim())return skipped.push(tag+': missing "model" (.glb filename)');
  if(!pick(it.title))return skipped.push(tag+' ('+it.model+'): missing "title"');
  const sid=ALIAS[slug(it.section)];
  if(!sid)return skipped.push(tag+' ('+it.model+'): unknown "section" "'+it.section+'" (use '+SECTIONS.map(x=>x.id).join(' or ')+')');
  items.push({i:items.length,section:sid,title:it.title,description:it.description,model:it.model.trim()});
 });
 if(skipped.length)console.warn('[Engineering Design] skipped entries:',skipped);
 return{items,skipped};
}

/* ---- viewers: lazy, one WebGL context per on-screen viewer --------- */
const live=new Set();let raf=0,viewers=[],io=null,ro=null,token=0,args=null;
function tick(){raf=live.size?requestAnimationFrame(tick):0;live.forEach(v=>v.frame())}
function ensureLoop(){if(!raf&&live.size)raf=requestAnimationFrame(tick)}

class Viewer{
 constructor(item,el){
  this.item=item;this.el=el;this.cv=el.querySelector('.ed-cv');this.ov=el.querySelector('.ed-ov');
  this.url=modelUrl(item.model);this.model=null;this.mixer=null;this.R=null;this.saved=null;
  this.state='idle';this.engaged=false;this.rot=false;this.paused=false;this.clock=null;this.touch=coarse();
  const q=a=>el.querySelector('[data-a='+a+']');this.b={play:q('play'),rot:q('rot'),fs:q('fs')};
  q('reset').onclick=()=>this.reset();
  this.b.rot.onclick=()=>{this.rot=!this.rot;this.b.rot.setAttribute('aria-pressed',this.rot);if(this.R)this.R.ctl.autoRotate=this.rot};
  this.b.play.onclick=()=>{this.paused=!this.paused;this.b.play.setAttribute('aria-pressed',!this.paused)};
  this.b.fs.onclick=()=>{const f=document.fullscreenElement||document.webkitFullscreenElement;f===el?(document.exitFullscreen||document.webkitExitFullscreen).call(document):(el.requestFullscreen||el.webkitRequestFullscreen).call(el)};
  q('done').onclick=()=>this.setEngaged(false);
  el.addEventListener('pointerdown',()=>{if(!this.engaged)this.setEngaged(true)});
  el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')this.setEngaged(false)});
  this.ov.onclick=e=>{if(e.target.closest('[data-a=retry]'))this.fetchModel()};
 }
 setEngaged(b){
  this.engaged=b;this.el.classList.toggle('on',b);
  if(this.R){this.R.ctl.enableZoom=b;this.R.ctl.enabled=!this.touch||b}
 }
 fsState(){const f=document.fullscreenElement||document.webkitFullscreenElement;this.b.fs.setAttribute('aria-pressed',f===this.el)}
 enter(){
  if(this.R)return;
  if(!window.THREE||!THREE.GLTFLoader||!THREE.OrbitControls){this.state='error';return this.status('engine')}
  this.clock=this.clock||new THREE.Clock();this.mount();live.add(this);this.clock.getDelta();ensureLoop();
  if(this.state==='idle')this.fetchModel();
 }
 leave(){if(!this.R)return;live.delete(this);this.unmount()}
 mount(){
  const w=this.cv.clientWidth||640,h=this.cv.clientHeight||400;
  const r=new THREE.WebGLRenderer({antialias:true,alpha:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));r.setSize(w,h);r.outputEncoding=THREE.sRGBEncoding;
  this.cv.appendChild(r.domElement);
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,w/h,.1,200);
  sc.add(new THREE.AmbientLight(0xffffff,1.4));
  const d1=new THREE.DirectionalLight(0xffffff,2);d1.position.set(5,10,5);sc.add(d1);
  const d2=new THREE.DirectionalLight(0xffffff,.8);d2.position.set(-6,-3,-5);sc.add(d2);
  const ctl=new THREE.OrbitControls(cam,r.domElement);ctl.enableDamping=true;ctl.autoRotate=this.rot;ctl.autoRotateSpeed=1.4;
  if(this.saved){cam.position.copy(this.saved.p);ctl.target.copy(this.saved.t)}else cam.position.set(-3,2,4);
  ctl.update();
  this.R={r,sc,cam,ctl};
  if(this.model)sc.add(this.model);

function build(d,focus){
 const body=$('ed-body');if(!body)return;
 const by={};SECTIONS.forEach(x=>by[x.id]=[]);d.items.forEach(it=>by[it.section].push(it));
 $('ed-jump').innerHTML=SECTIONS.map(x=>`<a href="#" data-j="${x.id}">${esc(pick(x.title))}<small>${count(by[x.id].length)}</small></a>`).join('');
 $('ed-jump').onclick=e=>{const a=e.target.closest('a[data-j]');if(!a)return;e.preventDefault();document.getElementById('ed-s-'+a.dataset.j).scrollIntoView({behavior:'smooth'})};

  +(d.skipped.length?`<div class="ed-note err"><strong>${s('skipped')}</strong><ul>${d.skipped.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'');
 viewers=d.items.map(it=>new Viewer(it,body.querySelector(`.ed-view[data-i="${it.i}"]`)));
 const byEl=new Map(viewers.map(v=>[v.el,v])),byCv=new Map(viewers.map(v=>[v.cv,v]));
 io=new IntersectionObserver(es=>es.forEach(e=>{const v=byEl.get(e.target);if(v)e.isIntersecting?v.enter():v.leave()}),{rootMargin:'120px 0px'});

 viewers.forEach(v=>{io.observe(v.el);ro.observe(v.cv)});
 const tg=focus&&document.getElementById('ed-s-'+focus);if(tg)tg.scrollIntoView();
}

function disposeAll(){io&&io.disconnect();ro&&ro.disconnect();io=ro=null;viewers.forEach(v=>v.destroy());viewers=[];live.clear()}

const AR={"cent_single": ["مضخة الطرد المركزي أحادية المرحلة", "تحتوي المضخة على مروحة (Impeller) واحدة مثبتة على العمود داخل غلاف حلزوني. تنقل المروحة طاقة العمود الميكانيكية إلى المائع على هيئة طاقة حركية، ثم يحوّل الغلاف الحلزوني جزءاً منها إلى ضغط ساكن. تتميز بتدفق عالٍ عند ضغط متوسط.", "يدخل المائع محورياً عند عين المروحة بضغط منخفض، فتدفعه الريش الدوّارة نحو المحيط وتزيد سرعته المماسية. في الغلاف الحلزوني تتسع مساحة المقطع تدريجياً فتنخفض السرعة ويرتفع الضغط وفق معادلة برنولي، ثم يخرج المائع من فوهة التصريف، بينما يستمر انخفاض الضغط عند العين في سحب مائع جديد.", ["شبكات توزيع المياه البلدية", "شبكات المياه المنزلية", "الري الزراعي", "تدوير مياه التبريد وخطوط الأنابيب القصيرة"]], "cent_multi": ["مضخة الطرد المركزي متعددة المراحل", "تضم المضخة عدة مراوح متتالية على عمود واحد، وتضيف كل مرحلة جزءاً من الضغط، فيكون الضغط الكلي مجموع ضغوط المراحل بينما يبقى التدفق ثابتاً. وبذلك تولّد ضغوطاً عالية بحجم مدمج.", "يخرج المائع من المرحلة الأولى عبر قناة إرجاع (Diffuser) إلى عين المرحلة التالية، وهكذا حتى المرحلة الأخيرة. ترفع كل مروحة الضغط بمقدار متقارب، فيصبح ضغط التصريف بعد z مرحلة قريباً من z أضعاف ضغط المرحلة الواحدة.", ["تغذية المباني العالية بالمياه", "أنظمة تغذية المراجل الصناعية", "حقن المياه وضخ خطوط التصدير", "وحدات التناضح العكسي عالية الضغط"]], "sump": ["مضخة البالوعة العمودية", "محرك المضخة في الأعلى وعمود طويل يصل إلى هيكل المضخة المغمور داخل السائل. الغمر يجعلها ذاتية التحضير ويُلغي مشكلات ارتفاع السحب.", "تبقى المروحة المغمورة ممتلئة بالسائل دائماً، فيدفعه الضغط المتولد صعوداً في عمود التصريف، بينما يظل المحرك جافاً فوق مستوى الحوض.", ["تفريغ الخزانات الأرضية", "أحواض الصرف ومياه الفضلات", "حفر التصريف والأقبية"]], "axial": ["مضخة التدفق المحوري", "تدفع المائع بمحاذاة العمود بواسطة ريش تشبه المروحة. تعطي تدفقات ضخمة جداً عند ضغط تصريف منخفض جداً، وتتميز بسرعة نوعية عالية.", "تعمل ريش المروحة كأجنحة دوّارة تنقل كمية الحركة للمائع وترفع الضغط قليلاً على امتداد المحور، بينما تزيل ريش التوجيه الدوران المصاحب للتدفق.", ["السيطرة على الفيضانات", "محطات معالجة const C={"1": {"ar": {"sci": "تعتبر مضخات الطرد المركزي أحادية المرحلة النظام الأساسي لنقل الموائع غير القابلة للانضغاط في الهندسة الهيدروليكية. من الناحية العلمية والفيزيائية، تعتمد هذه المضخات على مبدأ تحويل الطاقة الحركية الدورانية (التي يولدها المحرك) إلى طاقة هيدروديناميكية في المائع عبر مكره واحد (Single Impeller) يدور بسرعات عالية داخل غلاف حلزوني (Volute). عندما يدخل المائع إلى منطقة الضغط المنخفض في مركز المكره، تلتقطه الريش المنحنية وتجبره على الدوران. بفعل قوة الطرد المركزي، يقُذف المائع شعاعياً نحو المحيط الخارجي للمكره، مما يؤدي إلى زيادة هائلة في طاقته الحركية وسرعته المتجهة. ومع خروج المائع من المكره ودخوله في الغلاف، تتسع مساحة المقطع العرضي تدريجياً. وبناً ء على قانون حفظ الطاقة، فإن هذا التباطؤ في سرعة المائع يؤدي إلى تحويل الطاقة الحركية إلى طاقة ضغط (Static Head). إن هذا النوع مقيد علمياً بقدرته على توليد فرق ضغط محدود يتناسب مع قطر المكره وسرعة دورانه، لذلك لا يمكن استخدامه في التطبيقات التي تتطلب ضغوطاً تفوق قدرة مرحلة واحدة، حيث قد يؤدي ذلك إلى حدوث ظاهرة التكهف (Cavitation).", "op": "يدخل المائع محورياً إلى مركز المكره الدوار. تقوم الريش بتسريع المائع ودفعه قطرياً نحو الأطراف. يتدفق المائع السريع في الغلاف الحلزوني الذي يقلل من سرعته ويحوله إلى ضغط، ثم يندفع خارجاً من منفذ الطرد.", "laws": ["معادلة برنولي (Bernoulli's Equation) لتحول الطاقة الحركية إلى ضغط ثابت.", "قوانين التقارب (Affinity Laws) تربط التدفق والضغط والقدرة بسرعة الدوران."], "apps": "توزيع المياه البلدية، أنظمة المياه المنزلية، الري الزراعي، وأنظمة التبريد منخفضة الضغط."}, "en": {"sci": "Single-stage centrifugal pumps operate by converting rotational kinetic energy into hydrodynamic energy within the fluid. This energy conversion is executed via a single rotating impeller enclosed within a stationary volute casing. As the fluid enters the low-pressure zone at the impeller's center, the curved vanes capture and force it to rotate. Driven by intense centrifugal force, the fluid is expelled radially toward the outer periphery, resulting in a massive increase in its kinetic energy and velocity vector. As the high-velocity fluid exits the impeller and enters the volute casing, the cross-sectional area gradually expands. According to the principle of energy conservation, this deliberate deceleration of fluid velocity directly transforms kinetic energy into static pressure. Scientifically, this type is limited in its ability to generate high pressure differentials, which are strictly proportional to the impeller's diameter and rotational speed. It cannot be utilized for ultra-high-pressure applications.", "op": "Fluid enters axially into the center of the spinning impeller. The rotating vanes accelerate the fluid and thrust it radially outwards. The high-velocity fluid flows into the expanding volute casing, which diffuses the flow, reducing velocity and increasing pressure, before directing it out.", "laws": ["Bernoulli's Equation: Dictates the transformation of kinetic energy into static pressure head.", "Affinity Laws: Correlates flow, head, and power to rotational speed."], "apps": "Municipal water distribution, domestic water nets, and agricultural irrigation."}, "t": "مضخات الطرد المركزي أحادية المرحلة (Single-Stage Centrifugal Pumps)"}, "2": {"ar": {"sci": "ص ممت المضخات متعددة المراحل هندسياً للتغلب على القيود الفيزيائية للمضخاتُ أحادية المرحلة وعجزها عن توليد ضغوط استثنائية. يعتمد الشرح العلمي هنا على مبدأ التراكم التسلسلي للطاقة. يتم تركيب عدة مكرات (Impellers) على عمود دوران واحد، وتعمل كل مكره كأنها مرحلة ضخ منفصلة. علميا،ً عندما يمر المائع عبر المرحلة الأولى، يكتسب ضغطاً معيناً وفقاً لقانون حفظ الطاقة. بدلاً من توجيه المائع للخارج، يتم توجيهه ديناميكياً عبر قنوات عبور إلى عين المكره للمرحلة الثانية، ويكون ضغط الدخول للمرحلة الثانية مساوياً لضغط الخروج من المرحلة الأولى. تقوم المرحلة الثانية بإضافة طاقة حركية وتحويلها إلى ضغط إضافي يجمع مع الضغط السابق. تتكرر هذه العملية عبر المراحل المتعددة، مما يؤدي إلى تراكم الضغط خطياً. التحدي العلمي في هذا التصميم هو إدارة القوة المحورية (Axial) (Thrust) الناتجة عن تزايد الضغط المتراكم، وهو ما يتطلب حلولاً كاستخدام أسطوانة التوازن.", "op": "يسحب المائع للمرحلة الأولى ليرفع ضغطه. يتم توجيه المائع المضغوط داخلياً إلى مركز المرحلة الثانية لمضاعفة الضغط. يستمر الانتقال التسلسلي على نفس عمود الدوران، حيث تضيف كل مرحلة ضغطا (Headً) بينما يظل معدل التدفق ثابتا،ً حتى يخرج بالضغط الأقصى.", "laws": ["مبدأ الجمع الخطي للضغط (Additive Head Principle) إجمالي الارتفاع يساوي مجموع كل مرحلة.", "ميكانيكا الإجهاد (Stress Mechanics) موازنة القوى المحورية لعمود الدوران."], "apps": "تزويد المياه للمباني الشاهقة، مياه تغذية الغلايات الصناعية، وعمليات حقن المياه في الآبار النفطية."}, "en": {"sci": "Multi-stage centrifugal pumps are engineered to overcome the physical limitations of single-stage pumps regarding high head generation. The scientific explanation relies on the principle of sequential energy accumulation. Multiple impellers are mounted on a single rotating shaft. Scientifically, as fluid passes through the first stage, it acquires a specific pressure increase. Instead of discharging into the piping network, the fluid is dynamically routed through crossover passages directly into the suction eye of the second stage. The inlet pressure of the second stage equals the outlet pressure of the first. The second stage imparts additional kinetic energy, converting it into further static pressure added to the existing pressure. This process repeats across multiple stages, leading to a linear mathematical accumulation of total pressure while the mass flow rate remains constant. A major mechanical challenge in this design is managing the tremendous axial thrust generated by the cumulative pressure gradient, requiring balancing drums.", "op": "Fluid is drawn into the first stage receiving an initial pressure boost. Internal passages guide this pressurized fluid into the second stage, where pressure is compounded. The fluid travels sequentially through all impellers, adding pressure head while maintaining constant flow.", "laws": ["Additive Head Principle: Total discharge head is the sum of heads produced by each stage.", "Thrust Laws: Used to calculate and balance the net axial hydraulic forces."], "apps": "High-rise building supplies, industrial boiler feed systems, and high-pressure oilfield water injection."}, "t": "مضخات الطرد المركزي متعددة المراحل (Multi-Stage Centrifugal Pumps)"}, "3": {"ar": {"sci": "المضخات الغاطسة العمودية هي تطبيق هندسي فريد لمبادئ الطرد المركزي، مصممة لحل مشكلة رفع الموائع من مستويات منخفضة (كالخزانات الأرضية) دون مواجهة تكهف خط السحب (Cavitation). من الناحية العلمية، تعاني المضخات السطحية من قيود الضغط الجوي ولا يمكنها سحب الماء نظرياً لأكثر من 10 أمتار عمودياً بسبب انخفاض الضغط وتبخر المائع. تتجاوز المضخة الغاطسة هذا القيد بوضع وحدة الضخ (المكره والغلاف) بالكامل تحت سطح المائع، بينما يظل المحرك الكهربائي فوق السطح. يتم نقل الحركة عبر عمود دوران عمودي ممتد. غمر المكره بالكامل يضمن توفر ضغط هيدروستاتيكي إيجابي مستمر عند عين السحب، مما يرفع من قيمة (NPSH available) ويمنع تماماً تبخر السائل. ديناميكيا،ً يقوم المكره المغمور بتحويل الطاقة الحركية إلى ضغط دفع يرفع المائع عبر أنبوب تصريف عمودي للتغلب على قوة الجاذبية.", "op": "يثُبت المحرك في الأعلى ويتصل بعمود يمتد لأسفل. تدور المكره المغمورة بالكامل في السائل لتسحبه مباشرة. يُ دفع المائع للأعلى عبر أنبوب عمودي يحيط بعمود الدوران ليصل إلى السطح ويتم تصريفه للخارج.", "laws": ["حسابات الضغط الإيجابي الصافي (NPSH) لضمان عدم حدوث التكهف.", "ديناميكا الموائع العمودية: لحساب الطاقة المطلوبة للتغلب على فرق الارتفاع الاستاتيكي."], "apps": "تجفيف الخزانات تحت الأرضية، سحب مياه الصرف الصحي، وأنظمة تجميع المياه الصناعية."}, "en": {"sci": "Vertical sump pumps are geometrically designed to solve the inherent limitations of lifting fluids from deep sub-surface levels without encountering suction cavitation. Scientifically, surface-mounted pumps are strictly bounded by atmospheric pressure limits and cannot lift water vertically beyond ~10 meters due to fluid vaporization (NPSH constraints). The vertical sump pump bypasses this physical limitation by directly submerging the entire pumping element (impeller and casing) deep within the fluid, while keeping the motor securely mounted on a dry surface above. Rotational torque is transmitted via an extended vertical shaft. Submerging the impeller geometrically guarantees a continuous positive hydrostatic pressure at the suction eye. This significantly maximizes the Net Positive Suction Head available (NPSHa), eradicating the possibility of cavitation. Dynamically, the submerged impeller imparts kinetic energy, converting it into a static discharge head capable of propelling fluid upwards against gravity through a vertical discharge pipe.", "op": "The motor is mounted on a dry upper deck connected to a long shaft extending down. The submerged impeller spins within the fluid, drawing it directly into the casing and pushing it vertically upwards through a discharge column pipe to the surface.", "laws": ["Net Positive Suction Head (NPSH) Theory: Submersion ensures NPSHa > NPSHr.", "Static Head & Gravity Mechanics: Overcoming the vertical fluid column resistance."], "apps": "Draining underground tanks, clearing wastewater sumps, and lifting industrial sludge."}, "t": "المضخات الغاطسة العمودية (Vertical Sump Pumps)"}, "4": {"ar": {"sci": "تعتمد مضخات الجريان المحوري على الديناميكا الهوائية والمائية لريش تشبه المروحة (Propeller) بدلاً من قوة الطرد المركزي. يعتمد الشرح العلمي على نظرية الرفع (Lift Theory) والدفع (Thrust) حيث يصُمم انحناء الريش لخلق فرق في الضغط بين السطح الأمامي والخلفي للريشة أثناء دورانها. هذا الفرق يولد قوة رفع ديناميكية تدفع المائع في خط مستقيم مواٍ ز لمحور دوران العمود (محوريا (ً). لغياب التوسع الشعاعي، تتميز هذه المضخات بقدرتها على نقل كتل هائلة جداً من الموائع ولكن بضغوط طرد منخفضة جداً. فيزيائيا،ً تتمتع بمنحنى أداء حاد (Steep) (Curve) حيث يرتفع استهلاك القدرة بشكل خطير إذا تم إغلاق صمام الطرد، عكس مضخات الطرد المركزي.", "op": "تدور المروحة داخل أنبوب أسطواني مستقيم وتدفع المائع للتحرك في مسار خطي مواٍ ز لعمود الدوران. لا ينحرف المائع شعاعياً بل يمر مباشرة عبر المروحة ويخرج من الطرف الآخر لتعزيز تدفق كميات ضخمة.", "laws": ["نظرية الرفع (Lift Theory) القوة المتولدة تعتمد على زاوية هجوم الريش.", "منحنيات القدرة الديناميكية (Dynamic Power Curves) القدرة القصوى تستهلك عند إغلاق الصمام."], "apps": "مشاريع التحكم في الفيضانات، محطات معالجة المياه الأولية، وتدوير مياه التبريد الضخمة."}, "en": {"sci": "Axial flow pumps operate on the hydrodynamic principles of propeller blades rather than centrifugal force. The scientific foundation is based on Lift and Thrust theories. The blades are pitched at specific angles to create a pressure differential between the leading and trailing surfaces as they rotate. This dynamic pressure differential generates a lift force that thrusts the entire body of fluid in a linear, straight path perfectly parallel to the rotational shaft axis. Due to the absence of radial expansion, axial flow pumps are optimized to move massive fluid masses (ultra-high flow rates) but at the expense of generating very low discharge pressures. Physically, they present a steep performance curve where power consumption spikes dangerously to its maximum if the discharge valve is closed, contrary to centrifugal pumps.", "op": "A propeller rotor spins within a straight tubular casing, pushing the fluid linearly along the shaft's axis. The fluid enters and exits the pump in a straight line, ensuring maximum volume displacement with minimal pressure resistance.", "laws": ["Hydrodynamic Lift Theory: Propulsion force generated by blade angle of attack.", "Steep Power Curve Physics: Power at zero flow (shut-off head) is highest."], "apps": "Massive-scale flood control, primary water treatment plants, and cooling water circulation loops."}, "t": "مضخات الجريان المحوري (Axial Flow Pumps)"}, "5": {"ar": {"sci": "تعتمد المضخات الترسية على نظرية الإزاحة الحجمية الثابتة الدوارة. علميا،ً يتم الضخ عبر الحركة المتشابكة لترسين داخل غلاف محكم الإغلاق بخلوصات ميكرومترية. عند منفذ السحب، تنفصل أسنان التروس عن بعضها، مما يخلق زيادة لحظية في الحجم الكلي وتشكيل فراغ جزئي قوي يسحب المائع عالي اللزوجة. يحُبس المائع وينقل قسرياً على طول المحيط الخارجي للغلاف باتجاه منفذ الطرد. عند الطرد، تعود أسنان التروس للتشابك، مما يقلص الحجم المتاح إلىٍ عال جداً. الميزة الصفر تقريبا،ً ويجُبر المائع فيزيائياً على الخروج تحت ضغط العلمية هي أن التدفق يتناسب طردياً مع سرعة الدوران بشكل مستقل تقريباً عن مقاومة النظام، وتزداد الكفاءة الحجمية مع زيادة لزوجة المائع لأنها تقلل من التسرب الداخلي.", "op": "ينفصل الترس القائد والمقاد عند السحب لسحب المائع وتكوين فراغ. يحُجز المائع بين التروس والجدار ويدور معها للمحيط. تتشابك الأسنان بقوة عند الطرد لطرد المائع بصورة مستمرة ومنع رجوعه.", "laws": ["قانون الإزاحة الحجمية: التدفق يعتمد على الأبعاد الهندسية وسرعة الدوران فقط.", "ديناميكا الموائع اللزجة: تقلل اللزوجة العالية من التسرب الداخلي (Internal Slip)."], "apps": "أنظمة التحكم الهيدروليكي، تزييت المحركات الميكانيكية، ونقل الزيوت والبوليمرات."}, "en": {"sci": "Gear pumps are rotary positive displacement machines grounded in the theory of fixed volumetric displacement. Mechanically, pumping relies on the intermeshing kinematics of two gears housed within a tightly sealed casing. As the gears rotate, their teeth unmesh at the suction inlet, creating a sudden volumetric expansion and establishing a strong localized partial vacuum that forcefully draws in viscous fluids. The fluid is trapped and transported along the outer periphery of the casing. At the discharge port, the gear teeth aggressively intermesh once again, reducing the available volume back to nearly zero. This physical constriction forcibly displaces the fluid out into the piping network under high pressure. The profound scientific advantage is that flow rate is linearly proportional to rotational speed, remaining unaffected by back-pressure. High fluid viscosity significantly boosts overall volumetric efficiency by acting as a physical seal against internal slip.", "op": "A drive gear and an idler gear unmesh at the inlet to draw fluid. Fluid is trapped between the teeth and the casing, carried around, and then squeezed out when the teeth tightly re-mesh at the discharge.", "laws": ["Volumetric Displacement Equation: Flow rate relates directly to RPM and geometry.", "Viscous Slip Theory: Internal leakage decreases as fluid viscosity increases."], "apps": "Hydraulic machinery loops, mechanical engine lubrication, and transferring viscous oils."}, "t": "المضخات الترسية (Gear Pumps - Rotary)"}, "6": {"ar": {"sci": "المضخات اللولبية هي آلات إزاحة موجبة متطورة تعتمد على الحركة الكينماتيكية للبراغي الحلزونية (Helical Screws) الدوارة داخل تجويف أسطواني مطابق تماماً. الدوران المستمر للبراغي المتشابكة يخلق سلسلة من الغرف (تجويفات) المغلقة بإحكام بين سنون البراغي والغلاف الداخلي. فيزيائيا،ً مع الدوران، تتحرك هذه الغرف المغلقة التي تحوي المائع بشكل خطي مواٍ ز لمحور الدوران من جهة السحب إلى الطرد. هذا التصميم الهندسي العبقري يمنع تماماً تشكل أي نبضات (Pulsations) في خط الطرد، ويقلل من معدلات القص الداخلي (Shear) (Stress) مما يجعله مثالياً للسوائل الحساسة. يوفر السطح التلامسي قوة عزل هائلة تمنع رجوع المائع (Slip) حتى عند الضغوط العالية جدا،ً لتنقل الموائع عالية اللزوجة الثقيلة دون فقدان الكفاءة الحجمية.", "op": "يدخل المائع من السحب ليملأ الفراغات الحلزونية للبراغي المتشابكة. ينحصر المائع في تجاويف متتالية تتحرك بشكل خطي مستمر نحو فتحة التصريف ليتم دفعه للخارج بضغطٍ عال وتدفق انسيابي.", "laws": ["هندسة الحركة الحلزونية (Helical Kinematics) تحدد التدفق بناً ء على عمق وزاوية الحلزون.", "نظرية العزل الهيدروديناميكي: لزوجة المائع تعمل كمانع تسرب لزيادة الضغط."], "apps": "التعامل المستمر مع السوائل شديدة اللزوجة مثل النفط الخام الثقيل، القطران والأسفلت، والعصائر الكثيفة."}, "en": {"sci": "Screw pumps utilize the complex kinematics of co-rotating helical screws encased within a precisely machined cylindrical housing. As the interconnected helical threads rotate, they form a continuous series of hermetically sealed progressive cavities between the screw flights and the casing walls. Physically, as rotation progresses, these enclosed fluid-filled cavities travel axially along the shaft in a continuous, uninterrupted linear motion from the suction inlet to the discharge outlet. This geometric design totally eliminates fluid pulsation in the discharge line and inherently induces exceptionally low internal shear stresses, rendering it scientifically optimal for shear-sensitive fluids. The extensive contact surface area provides a massive hydrodynamic sealing effect. This sealing firmly prevents internal fluid backflow even under extreme discharge pressures, allowing the continuous pumping of abrasive and ultra-viscous fluids.", "op": "Fluid is drawn into the spiraling thread cavities of intermeshing rotors. As the rotors turn, the fluid is trapped in sequential pockets and advanced linearly and smoothly toward the discharge port against high back-pressures.", "laws": ["Helical Kinematic Geometry: Flow determined by pitch angle, depth, and speed.", "Hydrodynamic Sealing Dynamics: Viscosity acts as a physical sealant against internal slip."], "apps": "Continuous handling of highly viscous fluids like heavy crudes, tars, syrups, and lube systems."}, "t": "المضخات اللولبية (Screw Pumps - Rotary)"}, "7": {"ar": {"sci": "تنتمي المضخات المكبسية إلى فئة الإزاحة الموجبة الترددية. علميا،ً تعتمد على نظرية الحجم المحصور حيث لا يمكن ضغط السوائل بدرجة ملحوظة. عند حبس السائل وتقليل حجم التجويف ميكانيكياً عبر مكبس خطي، يولد السائل مقاومة هائلة تترجم لضغط دفعي مرتفع جداً. في شوط السحب، يتوسع الحجم ويخلق فراغاً لفتح صمام السحب أحادي الاتجاه وسحب المائع. وفي شوط الدفع، يقلص المكبس حجم الحجرة، مما يرفع ضغط المائع فورياً ويجبر صمام الدفع على الفتح. معدل التدفق مستقل تقريباً عن الضغط في خط الطرد، ويعتمد تماماً على الأبعاد الهندسية للأسطوانة وسرعة دوران العمود المرفقي، مما يجعلها مثالية لتوليد ضغوط قاسية جداً.", "op": "يدور العمود المرفقي ليسحب المكبس للخلف لامتلاء الأسطوانة بالمائع. يندفع المكبس للأمام في شوط الانضغاط ليغلق صمام السحب ويجبر المائع بضغط شديد على المرور عبر صمام الطرد بقوة نحو الأنابيب.", "laws": ["قانون باسكال (Pascal's Principle) لانتقال الضغط في المائع المحصور.", "معادلة التدفق الحجمي (Volumetric Flow) التدفق يعتمد على مساحة المكبس وطول الشوط."], "apps": "عمليات التكسير الهيدروليكي (Hydraulic Fracturing) في الآبار النفطية، وأنظمة الغسيل بالضغط العالي."}, "en": {"sci": "Piston and plunger pumps operate on the principle of trapped volumes and forced fluid displacement. Scientifically, liquids are largely incompressible; when a specific volume of liquid is confined within a closed chamber and its volume is mechanically reduced by a linearly moving piston, it generates massive resistance that translates into extremely high discharge pressure. During the suction stroke, the expanding chamber volume creates a partial vacuum that forces fluid in through a one-way suction valve. During the discharge stroke, the plunger reverses, shrinking the volume, instantly raising fluid pressure, sealing the suction valve, and forcing the discharge valve open. The paramount scientific feature is that the flow rate is nearly independent of the system's discharge pressure; it relies entirely on the cylinder's geometry and the crankshaft's speed, making it perfectly suited for extreme high-pressure applications.", "op": "An oscillating piston moves inside a valved cylinder. The backward stroke draws fluid in, while the forward stroke forces the fluid out through the discharge valve under extreme high pressure.", "laws": ["Pascal's Principle: Applied pressure is transmitted equally throughout the confined fluid.", "Volumetric Flow Equation: Calculates theoretical flow based on stroke length and diameter."], "apps": "Generating extremely high discharge pressures for high- pressure wash systems and hydraulic fracturing."}, "t": "المضخات المكبسية (Piston/Plunger Pumps - Reciprocating)"}, "8": {"ar": {"sci": "تعتبر مضخات الغشاء آلات إزاحة موجبة ترددية مصممة خصيصاً للتطبيقات الكيميائية القاسية. يعتمد الشرح العلمي على استخدام غشاء مرن (Membrane) من مواد بوليمرية يقسم حجرة المضخة إلى قسمين: قسم يحتوي على مائع التشغيل (أو هواء مضغوط) وقسم يحتوي على المائع المراد ضخه. نبضات مائع التشغيل تدفع الغشاء للانحناء ذهاباً وإياباً. فيزيائيا،ً هذا الانحناء يغير حجم حجرة الضخ؛ الانكماش يخلق فراغاً لسحب المائع، والتمدد يجبر المائع على الخروج بضغطٍ عال عبر صمامات عدم الرجوع الكروية. الأهمية العلمية تكمن في العزل الميكانيكي التام: لا توجد أي أجزاء معدنية متحركة تحتك بالمائع، مما يمنع التسرب ويحمي المضخة من التآكل الكيميائي أو الميكانيكي الناتج عن السوائل الحمضية والمواد الكاشطة، ويضمن ضخاً بحجم ثابت.", "op": "يتحرك الغشاء المرن للخلف لتوسيع حجرة السحب وجذب السائل الكيميائي، ثم يندفع للأمام بفعل ميكانيكي أو ضغط هوائي لتقليص الحجم وطرد السائل بقوة عبر الصمامات دون أي تلامس مع الأجزاء المعدنية.", "laws": ["ديناميكا الموائع المحصورة: تغير الحجم الهندسي يولد فروق الضغط اللازمة للضخ.", "علم هندسة المواد (Material Science) مرونة وقوة تحمل البوليمرات الكيميائية للإجهاد الترددي."], "apps": "ضخ المواد الكيميائية المسببة للتآكل، السوائل الحمضية (Acidic Fluids) والملاط شديد الكشط (Abrasive Slurries)."}, "en": {"sci": "Diaphragm pumps are reciprocating positive displacement machines explicitly engineered for severe chemical applications. The scientific basis involves using a flexible polymeric membrane (diaphragm) to physically isolate the pumping chamber from the mechanical drive or compressed air supply. Pulsations drive the flexible membrane to flex back and forth. Physically, this flexing alters the geometric volume of the pumping chamber; flexing backward expands the volume, creating a vacuum to draw fluid in, while flexing forward compresses the volume, forcing fluid out through non- return ball valves. The paramount scientific advantage is total mechanical isolation: no raw metal rotating parts or seals ever contact the pumped fluid. This entirely eliminates leak paths and protects the machinery from severe chemical corrosion or abrasive wear caused by aggressive acidic or slurry mediums, ensuring fixed volumetric pumping.", "op": "A flexible pulsating membrane flexes outward to draw fluid into the chamber through a suction check valve, and then flexes inward to forcefully expel the fluid through a discharge check valve. The fluid never touches metal components.", "laws": ["Confined Fluid Dynamics: Geometric volume alteration generates the required pressure differentials.", "Polymer Material Mechanics: The structural fatigue resistance of the flexible membrane."], "apps": "Ideal for corrosive chemicals, acidic fluids, or highly abrasive slurries since no raw metal parts contact the fluid."}, "t": "مضخات الغشاء (Diaphragm Pumps - Reciprocating)"}, "9": {"ar": {"sci": "تعتمد الضواغط الترددية على قوانين الديناميكا الحرارية وانضغاطية الغازات كآلة إزاحة موجبة. علميا،ً يتم حبس الغاز داخل أسطوانة وتقليل حجمه ميكانيكياً عبر مكبس. وفقاً لقانون بويل وقانون الغاز المثالي، عند تقليل الحجم، تزداد التصادمات الجزيئية للغاز مما يترجم إلى ارتفاع هائل في الضغط ودرجة الحرارة (انضغاط أدياباتيكي). لمنع الانصهار والاشتعال الذاتي للغاز، تصُمم الضواغط الصناعية بشكل متعدد المراحل مع وجود مبادلات حرارية (Intercoolers) بين المراحل. هذا التبريد البيني يخفض الحجم النوعي للغاز، ويقلل الشغل الميكانيكي المطلوب في المرحلة التالية مقترباً من الكفاءة الإيزوثيرمية، لتمكين الآلة من الوصول لضغوط هائلة لا تضاهى.", "op": "يتحرك المكبس للأسفل موسعاً الحجم وساحباً الغاز. ينعكس المكبس للأعلى فيغلق صمام السحب وينضغط الغاز حتى يتغلب على ضغط الشبكة، ليفتح صمام الطرد ويندفع الغاز المضغوط للخارج نحو خطوط الإنتاج.", "laws": ["قانون الغاز المثالي (PV=nRT) يربط بين حجم الغاز المضغوط وضغطه ودرجة حرارته.", "معادلات الشغل الأدياباتيكي: لتقييم الشغل المبذول لضغط الغازات وحساب التبريد البيني."], "apps": "تشغيل الأدوات في ورش صيانة السيارات (أحادية المرحلة)، وشبكات الضغط العالي الصناعية الثقيلة (متعددة المراحل)."}, "en": {"sci": "Reciprocating compressors operate strictly on the laws of positive as compressibility gas and thermodynamics displacement machines. The scientific explanation revolves around trapping a gas volume within a cylinder and forcibly reducing it via a piston. According to Boyle's Law and the Ideal Gas Law, reducing the volume multiplies intermolecular collisions, causing a tremendous increase in both static pressure and temperature (adiabatic compression). To prevent catastrophic overheating or auto-ignition, industrial compressors utilize multi-stage designs with intercoolers. This inter-stage cooling actively reduces the gas's specific volume, which drastically reduces the mechanical work required by the subsequent stage, effectively approaching isothermal efficiency. This staged thermodynamic manipulation grants these compressors the unique capability to achieve monumental pressure levels.", "op": "A piston reciprocates inside a cylinder. The suction stroke draws gas in by expanding the chamber volume. The compression stroke shrinks the volume, building gas pressure until it overcomes line pressure and exits through the discharge valve.", "laws": ["Ideal Gas Law (PV=nRT): Correlates absolute pressure, volume, and temperature rise.", "Adiabatic Work Equations: Calculates mechanical power and the thermodynamic necessity of intercooling."], "apps": "Single-stage variants power auto repair shops, while multi- stage configurations serve heavy industrial high-pressure networks."}, "t": "الضواغط الترددية (Reciprocating / Piston Compressors)"}, "10": {"ar": {"sci": "تستخدم الضواغط اللولبية برغيين حلزونيين متشابكين لضغط الغاز بشكل مستمر كآلة إزاحة موجبة دوارة. علميا،ً يتم سحب الغاز لملء الفراغات بين السنون الحلزونية الدوارة والغلاف الثابت. مع استمرار الدوران، تتناقص مساحة هذه الغرف الحلزونية تدريجياً وبشكل خطي نحو نهاية الطرد، مما يجبر الغاز على الانضغاط لرفع ضغطه. الأهمية الفيزيائية لهذا التصميم هي حقن الزيت المبرد (Oil Injected) المستمر داخل حجرة الضغط والذي يؤدي وظائف علمية بحتة: التبريد الفوري لامتصاص حرارة الانضغاط (مما يقرب العملية من الانضغاط الإيزوثيرمي المثالي)، منع التسرب (عزل الخلوصات لزيادة الكفاءة الحجمية)، وتزييت البراغي الدوارة التي تدور بسرعات عالية للعمل المستمر والمستقر على مدار الساعة.", "op": "يدخل الهواء ويتجمع في جيوب بين برغيين دوارين (قائد ومقاد). دوران البراغي يقلل حجم الجيوب تدريجياً لضغط الهواء بداخلها حتى يصل إلى منفذ الطرد، حيثٍ وخال من النبضات العنيفة. يُ طرد الهواء كتيار مضغوط مستمر", "laws": ["الديناميكا الحرارية الإيزوثيرمية: يمتص الزيت الحقني الحرارة لتقليل الشغل الميكانيكي للانضغاط.", "نسبة الانضغاط الحجمي الداخلي (Built-in Volume Ratio) تصميم زوايا الحلزون يحدد سعة الضغط العظمى."], "apps": "تعتبر المعيار الصناعي لتوصيل هواء المصانع المستقر والمستمر على مدار 24/7 دون توقف."}, "en": {"sci": "Rotary screw compressors utilize two intermeshing helical screws to continuously compress gas as rotary positive displacement machines. Scientifically, gas is drawn into the spaces between the mating helical threads and the stationary housing. As the rotors turn, the geometric volume of these progressive cavities gradually and continuously decreases toward the discharge end, forcing the gas into a smaller volume and raising its pressure. The physical cornerstone of this design in industrial applications is continuous oil injection. This oil serves purely scientific functions: it instantly absorbs the severe heat of compression (pushing the process closer to ideal isothermal compression), hydrodynamically seals the micro-clearances between the rotors (maximizing volumetric efficiency), and lubricates the high-speed interlocking screws for stable, uninterrupted continuous delivery.", "op": "Gas enters and fills the pockets between two interlocking spinning helical rotors. As the screws turn, the pocket volume decreases, squeezing and compressing the gas continuously until it is expelled out the discharge port in a smooth, non- pulsating stream.", "laws": ["Isothermal Thermodynamics: Injected oil absorbs heat to minimize the mechanical work of compression.", "Built-in Volume Ratio Geometry: The thread profile geometrically dictates the internal pressure ratio."], "apps": "The industry standard for continuous, stable plant air delivery over 24/7 cycles."}, "t": "الضواغط اللولبية الدوارة (Rotary Screw Compressors)"}, "11": {"ar": {"sci": "يعتمد الضاغط الحلزوني على الحركة الكينماتيكية المعقدة لولبين معدنيين (Scrolls) أحدهما ثابت والآخر يدور في مسار مداري (Orbiting) ولكن لا يلف حول نفسه. علميا،ً يخلق هذا التداخل المداري جيوباً هلالية الشكل من الغاز المسحوب في المحيط الخارجي. مع استمرار الحركة المدارية الصامتة، تتحرك هذه الجيوب الهلالية بشكل حلزوني مستمر نحو المركز (Core) وتقل مساحتها الحجمية تدريجياً وبسلاسة تامة لرفع الضغط وفقاً لقوانين الغازات. عندما يصل الغاز إلى المركز، يكون قد وصل لأقصى ضغط ليتم طرده عبر فتحة علوية. الفيزيائية الفريدة هنا هي الانعدام التام لصمامات السحب والطرد الميكانيكية التي تسبب الضوضاء وضعف الكفاءة، مما يجعل العملية انسيابية (Cycloidal) (path) هادئة جدا،ً وتوفر كفاءة حجمية شبه مثالية تليق بالبيئات المعزولة والمكيفات.", "op": "يتحرك الحلزون الدوار في مسار مداري متداخل مع الحلزون الثابت. يلتقط الغاز من الأطراف الخارجية، ويضغط الغاز في جيوب هلالية تصغر مساحتها تدريجياً أثناء تحركها نحو المركز، ليتم طرد الغاز المضغوط من فتحة في منتصف الحلزون الثابت بنعومة فائقة.", "laws": ["هندسة المسار الدائري (Cycloidal Kinematics) تحدد معدل انكماش الحجم الحلزوني للغاز المداري.", "قانون حفظ الكتلة وتقليل الخسائر الصمامية: انعدام الصمامات يرفع الكفاءة الحجمية بشكل ملحوظ."], "apps": "المكيفات المنفصلة السكنية والتجارية (Split ACs) وتطبيقات البيئات الطبية التي تتطلب هدوءاً واستقراراً تاماً."}, "en": {"sci": "Scroll compressors operate on the complex kinematics of two interleaved spiral metal scrolls: one fixed and the other orbiting eccentrically without rotating. Scientifically, this eccentric orbital motion creates crescent-shaped gas pockets at the outer periphery. As the silent cycloidal orbiting continues, these enclosed crescent pockets are forced to travel in a continuous spiral path toward the center core. Their geometric volume is smoothly and progressively reduced, compressing the gas according to fundamental gas laws. By the time the gas reaches the center, it achieves maximum pressure and is discharged through a central port. The unique physical advantage here is the complete elimination of mechanical suction and discharge valves, which typically cause mechanical noise and volumetric losses. This renders the cycloidal compression process remarkably smooth, exceptionally quiet, and volumetrically efficient.", "op": "An orbiting scroll moves cycloidally against a fixed scroll. Gas is drawn into the outer edge, trapped in crescent pockets, and squeezed into progressively smaller volumes as it moves spirally toward the center port, discharging the compressed gas smoothly.", "laws": ["Cycloidal Kinematic Geometry: Dictates the progressive volumetric reduction of the spiral gas pockets.", "Valve-less Volumetric Efficiency: The absence of mechanical valves eliminates dynamic flow resistance and wear losses."], "apps": "Predominantly used in residential/commercial split air conditioners and medical environments due to smooth, quiet operation."}, "t": "الضواغط الحلزونية (Scroll Compressors)"}, "12": {"ar": {"sci": "ضواغط الطرد المركزي هي الآلات الديناميكية الأساسية للتعامل مع أحجام الغازات الهائلة. الشرح العلمي يرتكز على تسريع الغاز المنُضغط لتحويل طاقته الحركية إلى ضغط ثابت. عندما يدخل الغاز محورياً لعين المكره (Impeller) الذي يدور بسرعات جنونية (قد تتجاوز 100 ألف لفة في الدقيقة)، تقوم الريش بطرده قطرياً بقوة نابذة، مما يمنح الغاز سرعة حركية هائلة متجهة للخارج. عند خروج الغاز عالي السرعة، يمر عبر ناشر (Diffuser) ذو مقطع عرضي متسع. استناداً إلى معادلة برنولي والديناميكا الهوائية، يحدث تباطؤ سريع للغاز، وبما أن الطاقة لا تفنى، فإن هذه الطاقة الحركية المهولة تتحول فوراً إلى طاقة ضغط (Static) (Pressure). تقُاس كفاءة الآلة بقدرتها على تجنب ظاهرة الانهيار الأيروديناميكي (Surge) حيث يرتد الغاز المضغوط للخلف عند انخفاض معدل التدفق، وهي ظاهرة فيزيائية خطيرة يجب التحكم بها عبر أنظمة متطورة.", "op": "يدخل الغاز لمركز ريش المكره الدوارة السريعة التي ترفسه شعاعياً للخارج بسرعة فائقة. يدخل الغاز بعد ذلك في قناة التوزيع (الناشر) الثابتة، التي صممت مساحتها لتتسع تدريجيا،ً لتبطل سرعة الغاز وتحوله فوراً لضغط انضغاطيٍ عال متدفق لمعامل البتروكيماويات.", "laws": ["معادلة برنولي وديناميكا الموائع القابلة للانضغاط: تحويل الطاقة الحركية (السرعة) العالية لضغط الغاز الثابت.", "ديناميكا الاضطراب والانهيار (Surge Dynamics) الحد الأدنى للتدفق اللازم لمنع رجوع الغاز العكسي المدمر."], "apps": "مبردات التكييف المركزي الكبيرة (Large HVAC central chillers) ومحطات المعالجة البتروكيماوية الضخمة."}, "en": {"sci": "Centrifugal compressors are the primary dynamic machines for processing massive volumetric gas flows. The scientific basis rests on rapidly accelerating compressible gas to convert its kinetic energy into static pressure. As gas enters axially into the eye of an impeller spinning at extreme speeds (sometimes exceeding 100,000 RPM), the blades propel it radially outward via centrifugal force, imparting massive outward kinetic velocity to the gas. Upon exiting the high- speed impeller, the gas flows into a stationary diffuser with an expanding cross-sectional area. Governed by Bernoulli's equation and aerodynamic principles, the gas rapidly decelerates. Since energy is conserved, this immense kinetic energy is instantaneously converted into high static pressure. The machine's scientific limit is bounded by the aerodynamic phenomenon known as \"Surge,\" a destructive physical condition where compressed gas violently reverses flow back into the impeller when the forward flow rate drops below a critical aerodynamic threshold.", "op": "Gas is accelerated radially outward through a high-speed rotating impeller, gaining extreme velocity. It then enters a stationary diffuser which slows the gas down, seamlessly converting the dynamic velocity head into static pressure before discharging.", "laws": ["Bernoulli & Compressible Aerodynamics: The fundamental conversion of high kinetic velocity into static gas pressure.", "Surge and Choke Dynamics: Aerodynamic limits governing the stable operating envelope of the compressor map."], "apps": "Essential for large-scale central HVAC chillers and continuous large-volume petrochemical processing plants."}, "t": "ضواغط الطرد المركزي (Centrifugal Compressors - Dynamic)"}, "13": {"ar": {"sci": "الضواغط المحورية هي قمة الهندسة الديناميكية، حيث تعتمد على مبادئ الرفع الهوائي (Aerodynamic Lift) لدفع وضغط الغاز في مسار مواٍ ز لمحور الدوران دون انحراف قطري. علميا،ً يتكون الضاغط من صفوف متناوبة من الريش الدوارة (Rotors) المرتبطة بالعمود، والريش الثابتة (Stators) المربوطة بالغلاف. تقوم الريش الدوارة بتسريع الغاز محورياً (إضافة طاقة حركية)، ثم تستلم الريش الثابتة هذا الغاز لتقوم بوظيفتين هندسيتين: الأولى هي توجيه الغاز بالزاوية الهجومية المثالية للصف الدوار التالي لمنع الدوامات، والثانية هي توسعة المسار قليلاً لتحويل جزء من تلك السرعة إلى ضغط ثابت (Diffusing effect). عبر عشرات المراحل المتتابعة، يرتفع ضغط الغاز وتزداد كثافته تدريجياً بينما يتناقص حجم المقطع العرضي للحفاظ على السرعة المحورية ثابتة. هذا التصميم يسمح بابتلاع كميات جنونية من الهواء الكفيلة بتغذية غرف الاحتراق في التوربينات العملاقة.", "op": "يشُفط الهواء للمحور، حيث يمر عبر صفوف متتالية تتكون من شفرات دوارة تزيد سرعته وشفرات ثابتة تبطئ السرعة لتحولها لضغط وتوجهه للصف الذي يليه. يمر الغاز بخط مستقيم (محوريا (ً) عبر المراحل المتعددة ليخرج في النهاية مضغوطاً بشدة ومستعداً لعمليات الاحتراق.", "laws": ["نظرية الرفع الأيروديناميكي: هندسة وتصميم الشفرات كأجنحة الطائرات لخلق ضغط متتالي دون انفصال التدفق (Stall).", "الديناميكا الحرارية متعددة المراحل: حساب انضغاط الغاز المحوري مع تقليل مساحة المقطع لتعويض زيادة الكثافة."], "apps": "حاسمة في المحركات النفاثة للطيران (Aviation jet engines) والتوربينات الغازية العملاقة لتوليد الطاقة."}, "en": {"sci": "Axial compressors represent the pinnacle of dynamic aerodynamics, relying on airfoil lift principles to propel and compress gas linearly parallel to the rotational axis. Scientifically, the compressor consists of alternating rows of spinning rotor blades attached to the shaft and stationary stator blades attached to the casing. The rotors accelerate the gas axially, imparting immense kinetic energy. The stators receive this high-velocity gas and perform two vital engineering functions: they redirect the gas at the optimal angle of attack for the next rotor stage to prevent aerodynamic stalling, and they act as diffusers to convert a portion of that kinetic velocity into static pressure. Over multiple sequential stages, the gas pressure and density compound progressively, while the physical casing diameter shrinks to maintain constant axial velocity. This sophisticated design permits the ingestion of colossal volumes of air required to feed the combustion chambers of massive turbines.", "op": "Gas passes straight through alternating rows of rotating and stationary blades parallel to the shaft axis. Rotors accelerate the gas, and stators diffuse it into pressure while re-directing the flow straight into the next stage, cumulatively building high pressure.", "laws": ["Aerodynamic Airfoil Theory: Blade cascade design dictates lift, drag, and prevents aerodynamic stall phenomena.", "Multi-Stage Compressible Flow Dynamics: Managing the progressive density increase by narrowing the flow annulus."], "apps": "Crucial for aviation jet engines and large utility-scale gas turbines used in power generation."}, "t": "الضواغط المحورية (Axial Compressors - Dynamic)"}, "14": {"ar": {"sci": "صمامات العزل مصممة هندسياً للعمل في وضعيتين فقط: إما الفتح الكامل لمرور المائع أو الإغلاق التام لعزله (On/Off). فيزيائيا،ً يُ صمم الصمام البوابي (Gate) (Valve) بقرص مسطح يرُفع عمودياً خارج مسار التدفق، مما يوفر مساراً مستقيماً وانسيابياً بالكامل، وبالتالي فإن الفقد في طاقة الضغط (Pressure Drop) يكون شبه معدوم والتدفق الاضطرابي (Turbulence) في أدنى مستوياته، لكنه بطيء الاستجابة. أما الصمام الكروي (Ball Valve) فيعتمد على كرة معدنية مجوفة ومثقوبة من المنتصف تدور بزاوية 90 درجة فقط. هندسيا،ً يعتمد العزل على التلامس المحكم بين سطح الكرة المصقول والمقاعد البوليمرية (Teflon Seats) مما يسمح بقطع التدفق بشكل سريع ولحظي استجابة لمتطلبات الطوارئ. كلا الصمامين لا يصلحان علمياً للتنظيم (Throttling) لأن الفتح الجزئي يسبب قوى قص عالية تتلف حواف القرص أو المقاعد البوليمرية وتسبب التكهف.", "op": "البوابي: تدار العجلة اليدوية لرفع البوابة ببطء لأعلى ليفتح المسار تماما،ً أو خفضها للغلق. الكروي: يُ دار المقبض ربع دورة (90) درجة) لتوجيه الفتحة الكروية بموازاة التدفق للفتح، أو إدارتها عمودياً للغلق السريع المحكم.", "laws": ["معامل التدفق للصمام (Cv) يسجل الصمام البوابي أعلى معامل تدفق (أقل مقاومة هيدروليكية) في حالة الفتح التام.", "ديناميكا التآكل والنحر (Erosion Dynamics) الاستخدام الخاطئ بالفتح الجزئي يسرع من نحر وتلف البوابة والكرة."], "apps": "الصمام البوابي لخطوط النفط والمياه الرئيسية (Main lines) والصمام الكروي للعزل السريع في الاستخدامات الصناعية والمنزلية."}, "en": {"sci": "Isolation valves are engineered strictly for absolute fully-open or fully-closed operations (on/off duty). Physically, the Gate Valve features a flat gate that lifts vertically completely out of the fluid's path. This provides a straight, unobstructed flow trajectory, meaning the dynamic pressure drop is practically negligible and flow turbulence is minimized; however, it is mechanically slow to actuate. Conversely, the Ball Valve utilizes a hollow, perforated metallic sphere that pivots exactly 90 degrees. Engineering-wise, isolation relies on the tight seal between the polished ball surface and resilient polymeric seats (like Teflon), allowing for rapid, quarter-turn shutoff during urgent isolations. Scientifically, neither valve can be used for regulating flow (throttling) because partial opening exposes the disc edges or soft seats to severe high-velocity shear forces, rapidly inducing destructive mechanical erosion and fluid cavitation.", "op": "Gate Valve: A threaded stem slowly lifts the solid gate out of the flow path for minimal drop. Ball Valve: A quick quarter-turn actuation aligns the sphere's bore with the pipe for full flow, or blocks it completely for instant shutoff.", "laws": ["Valve Flow Coefficient (Cv): Gate valves exhibit maximum Cv, indicating minimal hydraulic resistance when open.", "Fluid Shear and Erosion Dynamics: Explains why partial throttling physically destroys non-regulating valve trims."], "apps": "Gate valves for slow-acting main isolation lines; Ball valves for excellent, rapid domestic and industrial isolation."}, "t": "صمامات العزل: البوابي والكروي (Isolation Valves: Gate & Ball)"}, "15": {"ar": {"sci": "صمامات التنظيم مصممة هندسياً للتحكم الدقيق والمتعمد في معدلات التدفق وتخفيض الضغط التشغيلي. يعتمد صمام الجلوب (Globe Valve) على تصميم داخلي متعرج (Tortuous path) يجبر المائع على تغيير اتجاهه بزاوية 90 درجة مرتين عند المرور عبر المقعد والسدادة. علميا،ً هذا التغيير القسري للاتجاه يخلق مقاومة هيدروليكية شديدة واضطراباً محسوبا (Turbulenceً) يؤدي إلى هبوط حاد في الضغط (High Pressure Drop) ولكنه يسمح بتنظيم التدفق بمرونة تامة دون تلف أجزاء الصمام. الصمام الإبري (Needle Valve) هو نسخة دقيقة مصغرة؛ يعتمد على سدادة طويلة مدببة كالرأس الإبري تنزلق في مقعد مخروطي دقيق، مما يسمح بتغييرات ميكرومترية بطيئة وتدريجية في مساحة المقطع العرضي (Flow Area) مما يوفر تحكماً استثنائياً ودقيقاً للغاية في التدفقات الصغيرة جداً في بيئات القياس.", "op": "الجلوب: تدار العجلة لإنزال السدادة (Plug) تدريجياً لتقليص فتحة العبور المتعرجة وتخفيض التدفق والضغط. الإبري: يُ دار الصمام ببطء شديد لدفع الإبرة المخروطية الدقيقة لإغلاق المسار تدريجياً للتحكم بالقطرات الدقيقة أو التدفق الطفيف.", "laws": ["معادلة الاستمرارية وحسابات هبوط الضغط: تغيير مسار السائل ومساحته يولد هبوطاً محسوباً وآمناً في الضغط.", "خصائص التدفق الخطي والمتساوي النسبة: تحدد كيف يستجيب معدل التدفق لدرجة فتح الصمام التنظيمي."], "apps": "حلقات تنظيم التدفق الدقيقة (Flow regulation loops) مختبرات القياس والموائع الدقيقة (Micro-flows in labs)."}, "en": {"sci": "Regulation and throttling valves are engineered to intentionally modulate precise flow rates and step down system pressure. The Globe Valve relies on a geometrically winding (tortuous) internal path that forces the fluid to abruptly change direction by 90 degrees twice as it navigates the plug and seat. Scientifically, this severe directional change creates heavy hydraulic resistance and calculated turbulence, inherently incurring a high pressure drop. However, this design allows the plug to safely throttle flow incrementally without suffering physical erosion. The Needle Valve is a highly specialized micro-version of this concept. It utilizes a finely tapered, elongated needle-like plug sliding into a precisely matched conical seat. This geometry allows for slow, micrometric adjustments to the cross-sectional flow area, delivering ultra- precise, exceptional control over tiny flow volumes in measurement equipment.", "op": "Globe: Forces fluid through a winding seat path where a plug is lowered to fine-tune the restriction. Needle: Utilizes a fine tapered needle threaded deeply to adjust ultra-precise micro- flows.", "laws": ["Pressure Drop & Bernoulli's Principle: Directional changes translate kinetic energy directly into permanent pressure losses.", "Linear & Equal Percentage Flow Characteristics: Mathematical models defining flow modulation accuracy."], "apps": "Globe valves for general process flow regulation loops; Needle valves for ultra-precise micro-flows in laboratories."}, "t": "صمامات التنظيم: الجلوب والإبري (Regulation/Throttling Valves)"}, "16": {"ar": {"sci": "صمامات عدم الرجوع هي معدات حماية تلقائية ومستقلة تعمل بالكامل بناً ء على فيزياء ديناميكا الموائع دون الحاجة لمشغل خارجي. الهدف العلمي هو السماح بمرور التدفق في اتجاه واحد ومنع التدفق العكسي (Backflow) المدمر للمضخات. في صمام عدم الرجوع المتأرجح (Swing Check) تدفع الطاقة الحركية (زخم المائع) قرصاً مفصلياً للأعلى ليفتح الطريق. عند توقف الضخ، تتغلب قوة الجاذبية والضغط العكسي على القرص ليسقط ويغلق المسار بإحكام. في صمام الرفع (Lift Check) يستخدم المائع لرفع قرص أو مكبس عمودي التوجيه ضد وزن المكبس وقوة الزنبرك. عند انخفاض الضغط الأمامي، يدفع الزنبرك والضغط العكسي المكبس لأسفل بقوة للحفاظ على النظام معزولا.ً تعتمد سرعة استجابة الصمام على الكتلة، قوة الزنبرك، والخواص الهيدروليكية للمائع لتجنب ظاهرة المطرقة المائية.", "op": "المتأرجح: السريان الأمامي يدفع البوابة المفصلية للفتح، والجاذبية تعيد إغلاقها عند توقف الضخ. الرفع: السريان يرفع المكبس عمودياً للتمرير، والزنبرك مع ضغط الرجوع يغلق المكبس فور توقف الضخ لمنع ارتداد السائل للمعدات السابقة.", "laws": ["معادلة كمية الحركة (Momentum Equation) الزخم الأمامي للسائل يتغلب على الوزن العكسي لإبقاء الصمام مفتوحاً.", "ظاهرة المطرقة المائية (Water Hammer Dynamics) إغلاق الصمام بسرعة مناسبة يمنع موجات الصدمة المدمرة في الأنابيب."], "apps": "حماية المعدات الأولية مثل المضخات من الرجوع العكسي، وتقييد السريان لاتجاه واحد."}, "en": {"sci": "Non-return or check valves are autonomous safety devices relying entirely on the physics of fluid dynamics, requiring no external actuators. Their scientific purpose is to permit flow in a single forward direction while strictly preventing destructive reverse flow (backflow) from damaging upstream machinery. In a Swing Check Valve, the fluid's kinetic momentum physically pushes a hinged flapper disc open. When forward flow ceases, gravity and the accumulating reverse pressure violently slam the flapper shut to seal the pipe. In a Lift Check Valve, the forward hydrodynamic pressure lifts a vertically guided piston or disc against its own weight and an internal spring. When forward pressure drops, the spring force coupled with the reverse back-pressure instantly forces the piston downward to seal the seat. The valve's response time is governed by mass inertia and spring mechanics to mitigate destructive water hammer shockwaves.", "op": "Swing Check: Fluid flow swings a gravity-assisted flapper open; it falls shut when flow reverses. Lift Check: Fluid lifts a vertical piston mechanism open; a spring pushes it shut upon flow cessation to protect upstream machinery.", "laws": ["Fluid Momentum & Inertia Physics: Forward velocity must exert enough force to overcome gravity and spring tension.", "Water Hammer Transients: Dynamic closure timing is critical to prevent acoustic shockwaves in the piping system."], "apps": "Restricting flow to a single direction to strictly protect upstream machinery like pumps and compressors."}, "t": "صمامات عدم الرجوع: المتأرجح والرفع (Check Valves: Swing & Lift)"}, "17": {"ar": {"sci": "تعتبر صمامات الأمان وتنفيس الضغط الملاذ الأخير لحماية المنشآت الصناعية من الانفجارات الكارثية الناتجة عن تراكم الضغط فوق حدود التصميم الهندسي. فيزيائيا،ً يعتمد الصمام على آلية موازنة القوى بين الضغط الهيدروستاتيكي أو الهوائي المتراكم في النظام وبين قوة زنبرك معاير ميكانيكيا (Calibratedً) (Spring). بالنسبة للغازات والأبخرة القابلة للانضغاط، يستخدم صمام الأمان (Safety Valve) الذي يعتمد على خاصية الفتح الفجائي (Pop-open) (action) حيث يتوسع الغاز بسرعة عند تجاوزه حد الضبط، مما يفتح الصمام بالكامل وبشكل فوري لتنفيس الحجم الغازي الهائل. أما الموائع السائلة غير القابلة للانضغاط، فيسُتخدم لها صمام التنفيس (Relief Valve) والذي يعتمد على الفتح التدريجي النسبي (Cracking proportionally) بالتوازي مع الزيادة البسيطة في الضغط، ليتيح تصريف السائل الزائد بشكل آمن ومنع تمزق خطوط الأنابيب.", "op": "يتم ضبط زنبرك قوي على ضغط معين. عندما يتجاوز ضغط المائع هذا الحد، يتغلب على قوة الزنبرك، فيرتفع القرص. يفتح صمام الأمان بقوة لحظية لتصريف الغازات، بينما يفتح صمام التنفيس جزئياً وبشكل تدريجي لتقطير السوائل الزائدة حتى يعود الضغط لوضعه الآمن.", "laws": ["قانون هوك للمرونة (Hooke's Law) قوة الزنبرك المعاكسة للضغط تتناسب مع مسافة الانضغاط.", "ديناميكا الموائع الانضغاطية وغير الانضغاطية: تبرر سرعة الفتح الفجائي للغازات والفتح التدريجي البطيء للسوائل."], "apps": "توفير الحماية الحرجة ضد الضغط الزائد (Critical overpressure) (protection) للأوعية المغلقة والغلايات."}, "en": {"sci": "Safety and relief valves serve as the ultimate fail-safe to protect industrial infrastructure from catastrophic explosions resulting from overpressure scenarios exceeding design thresholds. Physically, the valve relies on a delicate force- balance mechanism comparing the upward hydrostatic or pneumatic system pressure against the downward mechanical force of a calibrated spring. For compressible gases and vapors, a Safety Valve is utilized. It relies on a specialized geometric shroud that triggers an instantaneous, full \"pop- open\" action as expanding gas breaches the set-point, allowing the massive volumetric expansion to vent immediately. Conversely, for incompressible liquid mediums, a Relief Valve is employed. Because liquids cannot compress or rapidly expand, the relief valve merely \"cracks open\" proportionally in direct correlation to the pressure increase, gently weeping the excess liquid out of the system to prevent pipe rupture while maintaining system stability.", "op": "System pressure pushes against a set spring. Safety Valves pop open instantly for rapid release of compressible gases/vapors. Relief Valves crack open proportionally and slowly to pressure increases for non-compressible liquids to stabilize the system.", "laws": ["Hooke's Law of Elasticity: Spring force calibration dictates the exact set-pressure threshold.", "Compressible vs. Incompressible Fluid Dynamics: Dictates the explosive pop-open vs proportional cracking physical behaviors."], "apps": "Critical overpressure protection for pressure vessels, boilers, and continuous process piping loops."}, "t": "صمامات الأمان وتنفيس الضغط (Safety & Relief Valves)"}, "18": {"ar": {"sci": "صمام الخنق هو قطعة هندسية بالغة التعقيد تمثل بوابة التحكم الأولى والأهم على رأس البئر النفطي (Wellhead). الشرح العلمي لعمله يرتكز في تطبيقات ميكانيكا الموائع متعددة الأطوار تحت ضغوط قاسية. عندما يتدفق مزيج المكمن (نفط، غاز، ماء، رمال كاشطة) بضغوط عالية جداً عبر فتحة الخنق الضيقة داخل الصمام، تحدث ظواهر فيزيائية متطرفة. ينخفض مسار التدفق فجأة، مما يؤدي لزيادة هائلة في سرعة المائع استناداً لمعادلة الاستمرارية. هذه السرعة تتُرجم لانخفاض متعمد في الضغط لحماية منشآت المعالجة السطحية. التمدد السريع للغازات يفعل تأثير \"جول-طومسون\"، لتنخفض حرارة الغاز وقد يتسبب بتجمد بخار الماء. للتغلب على قوى القص الناتجة عن السرعة الهائلة (والتي تسبب النحر الميكانيكي الشديد) وقوى التكهف، يُ صنع القلب الداخلي (Trim) من مواد فائقة الصلابة ككربيد التنجستن (Tungsten Carbide) لامتصاص الطاقات التدميرية بكفاءة عالية، مما يضمن خنقاً متواصلاً لكسر الضغط العالي دون الانهيار الميكانيكي للصمام.", "op": "مركب مباشرة على شجرة الميلاد (Christmas Tree). يحتوي آلية قابلة للضبط لتغيير حجم مساحة العبور لتدفق البئر. الخنق المستمر يكسر ضغط المكمن الجوفي شديد الارتفاع ليحوله إلى ضغط تشغيلي مستقر وآمن لخطوط سطح المنشأة.", "laws": ["معادلة الاستمرارية: تضييق المقطع يؤدي لتسارع المائع لكسر طاقة الضغط.", "تأثير جول-طومسون: الانخفاض الحاد بالحرارة نتيجة هبوط الضغط وتمدد الغاز السريع."], "apps": "بوابة التحكم الأولى للأبار، تكسير الضغط العالي المستمر (Pressure) (breakdown) والتحكم بالإنتاج."}, "en": {"sci": "The choke valve is a highly sophisticated piece of engineering serving as the primary control gate mounted directly on the petroleum wellhead. Its scientific operation is rooted in the extreme mechanics of high-pressure multiphase flows. When a reservoir mixture—comprising oil, gas, water, and highly abrasive sand—blasts through the choke's narrow restriction at extreme pressures, severe physical phenomena occur. The severely restricted flow area forces a massive acceleration in fluid velocity based on the Continuity Equation. This velocity translates into a deliberate drop in total pressure to protect surface facilities. The rapid expansion of gases induces the Joule-Thomson effect, plunging gas temperatures and risking hydrate formation. To combat immense kinetic shear forces (mechanical erosion) and violent cavitation forces induced by these explosive pressures, the internal flow-control components (the trim) are engineered from ultra-hard Tungsten Carbide. This allows continuous throttling (choking) to safely step down high-pressure reservoir fluid to stable operating conditions.", "op": "The first gate of control on the wellhead's Christmas Tree. An internal mechanism restricts the cross-sectional flow area to continuously throttle and choke high-pressure reservoir fluid down to stable operating pressures.", "laws": ["Continuity Equation (A1V1 = A2V2): Extreme fluid acceleration caused by the restricted orifice area drops static pressure.", "Joule-Thomson Thermodynamic Effect: Dictates severe temperature drops during rapid gas expansion."], "apps": "Wellhead upstream pressure breakdown, regulating well flow rates, and severe service production control."}, "t": "صمام الخنق على رأس البئر (Choke Valve - API 6A)"}, "19": {"ar": {"sci": "صمام الإغلاق في حالات الطوارئ (ESD) يعتبر درع السلامة الرئيسي والأهم في البنية التحتية للمنشآت النفطية عالية الخطورة. علمياً وهندسيا،ً هذا الصمام مصمم لعدم التدخل مطلقاً في ظروف التشغيل العادية؛ حيث يظل مفتوحاً بنسبة %100 لتجنب التسبب في أي فقدان للطاقة الهيدروديناميكية (Pressure) (drop) وتفادي خلق اضطرابات في التدفق. الاعتماد العلمي الرئيسي يكمن في سرعة الاستجابة المطلقة ومبدأ \"الأمان التلقائي عند الفشل\" (Fail-Safe) (Principle). يُ دار الصمام بواسطة مشغلات ميكانيكية نيوماتيكية أو هيدروليكية (Pneumatic/Hydraulic actuators) تتطلب طاقة مستمرة لإبقائه مفتوحاً. فيزيائيا،ً يحتوي المشغل على زنبرك ضخم مضغوط بقوة هائلة (Heavy return) (spring). عند استشعار أجهزة التحكم لأي تسرب غاز، حرائق، أو تمزق في الأنابيب السطحية، يتم قطع الطاقة الهوائيةلمالهيدروليكية، مما يسمح للزنبرك القوي بتحرير طاقته الكامنة لدفع بوابة أو كرة الصمام وإغلاقه بشكل محكم وكامل فيٍ ثوان، ليعزل المخاطر تماماً ويفي بأقصى المعايير الصارمة للوقاية من أقل من 5 الحرائق (Fire-safe standards).", "op": "يعتمد الصمام على بقائه مفتوحاً دائماً. فور التقاط إشارة الخطر، يفرغ المشغل ضغط الهواء أو الزيت، ليتحرر زنبرك الإرجاع العملاق ويغلق الصمام أوتوماتيكياً بسرعة قصوى لقطع الإمدادات الهيدروكربونية وعزل المنشأة بشكل فوري عن الحريق أو الكسر.", "laws": ["ميكانيكا الطاقة الكامنة والحركية: تخزين طاقة الياي (الزنبرك) الميكانيكية للتحرر السريع عند فشل طاقة الضغط.", "هندسة الأمان التلقائي (Fail-Safe Design) تصميم يضمن أن أي عطل في النظام يرُجع المعدة لوضع الإغلاق الآمن."], "apps": "الدرع الآمن الرئيسي للمرافق النفطية، العزل اللحظي تحت ظروف الطوارئ القصوى (حرائق، تمزق خطوط الأنابيب)."}, "en": {"sci": "The Emergency Shutdown Valve (ESD) is the primary safety shield and ultimate safeguard within high-risk petroleum infrastructure. Scientifically and engineering-wise, this valve is designed to be entirely non-intrusive during normal operations; it remains 100% fully open to avoid inducing any hydrodynamic pressure drop or flow turbulence. The core scientific reliance is on absolute response speed and the uncompromising \"Fail-Safe\" thermodynamic and mechanical principle. The valve is powered by heavy-duty pneumatic or hydraulic actuators that require continuous energy to hold the valve open against a massively compressed mechanical return spring. Physically, if control sensors detect catastrophic events like fires, gas leaks, or pipe ruptures, the actuator energy is instantly vented. The massive potential energy stored in the heavy fail-safe return spring is immediately released, driving the valve to close fully and hermetically in under 5 seconds. This violently swift action instantly isolates the facility's hydrocarbon inventory, satisfying the strictest international fire-safe engineering standards.", "op": "It remains 100% open under normal operations to allow full flow. Powered by pneumatic/hydraulic actuators with a heavy fail-safe return spring, it closes fully in under 5 seconds upon detecting fires or ruptures by venting actuator pressure.", "laws": ["Potential to Kinetic Energy Mechanics: Stored spring force actuates the immediate mechanical closure upon pneumatic pressure loss.", "Fail-Safe Engineering Principles: Mandates that any system failure defaults the physical mechanism to a closed, safe state."], "apps": "The primary safety shield of oil facilities; instantaneous facility isolation under explosive fire or rupture emergencies."}, "t": "صمام الإغلاق في حالات الطوارئ (ESD Valve - API 6D)"}};

if(!p[0]){$('crumb').innerHTML='';const h=UI[L].h1,c=['#0071e3','#00a98f','#ff9500'];A.innerHTML=`<div class="hero"><h1>${h.map((w,i)=>`<span style="color:${c[i]}">${w}</span>`).join(' ')}</h1><p>${t('sub')}</p></div><div class="cards">${Object.entries(EQ).map(([k,e])=>`<div class="card" onclick="go('${k}')"><div class="ic" style="background:linear-gradient(135deg,${e.g1},${e.g2})">${ICON[k]}</div><h3 style="color:${e.c}">${nm(e)}</h3><p>${L==='ar'?e.d[1]:e.d[0]}</p><em style="color:${e.c}">${D.filter(d=>d.eq===k).length} ${t('types')} ${L==='ar'?'›':'›'}</em></div>`).join('')}${ED.card()}</div>`;return}
if(p[0]==='design')return ED.page(A,H,p);const e=EQ[p[0]];if(!e)return go('');A.style.setProperty('--acc',e.c);
if(!p[1]){$('crumb').innerHTML=H+` › ${nm(e)}`;A.innerHTML=`<h2 class="pg">${nm(e)}</h2>`+e.g.map((g,i)=>{let last='',h='';D.filter(d=>d.eq===p[0]&&d.g===i).forEach(d=>{const sb=SUB[d.id]?SUB[d.id][L==='ar'?1:0]:'';if(sb&&sb!==last)h+=`<h4 class="sg">${sb}</h4>`;last=sb;h+=`<div class="row" onclick="go('${p[0]}/${d.id}/0')"><div>${nm(d)}</div><span>❯</span></div>`});return`<div class="grp"><h3>${L==='ar'?g[1]:g[0]}</h3>${h}</div>`}).join('');return}
const d=D.find(x=>x.id===p[1]);if(!d)return go('');const tab=+p[2]||0;
$('crumb').innerHTML=H+` › <a onclick="go('${p[0]}')">${nm(e)}</a> › ${nm(d)}`;
const tabs=`<div class="tabs">${t('tabs').map((n,i)=>`<button class="tab ${i==tab?'on':''}" onclick="go('${p[0]}/${d.id}/${i}')">${n}</button>`).join('')}</div>`;
const li=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;let b='';
const cc=C[SEC[d.id]][L],sh=D.filter(x=>SEC[x.id]===SEC[d.id]).length>1,nt=sh?`<div class="note">${L==='ar'?'هذا القسم من الموسوعة يشرح النوعين معاً:':'This encyclopedia section covers both types together:'} ${D.filter(x=>SEC[x.id]===SEC[d.id]).map(nm).join(' · ')}</div>`:'';
if(tab==0)b=`<div class="panel"><h3>${nm(d)}</h3>${nt}<p>${cc.sci}</p></div>`;
if(tab==1)b=`<div class="panel"><h3>${t('tabs')[1]}</h3>${nt}<p>${cc.op}</p></div>`;
if(tab==2)b=`<div class="panel"><h3>${t('tabs')[2]}</h3>${nt}<ul class="laws">${cc.laws.map(x=>`<li>${x}</li>`).join('')}</ul>${d.l.map(x=>{const k=x.indexOf(':$$'),c=x.slice(0,k);return`<div class="eq"><small>${L==='ar'&&CAP[c]?CAP[c]:c}</small>${x.slice(k+1)}</div>`}).join('')}</div>`;
if(tab==3)b=`<div class="panel"><h3>${t('tabs')[3]}</h3>${nt}<p>${cc.apps}</p></div>`;
if(tab==4)b=simHTML(d);
const lst=D.filter(x=>x.eq===p[0]),i=lst.indexOf(d),pv=lst[i-1],nx=lst[i+1];
A.innerHTML=`<h2 class="pg">${nm(d)}</h2>${tabs}${b}<div class="pager"><button ${pv?`onclick="go('${p[0]}/${pv.id}/${tab}')"`:'style="visibility:hidden"'}>${t('prev')} ${pv?nm(pv):''}</button><button ${nx?`onclick="go('${p[0]}/${nx.id}/${tab}')"`:'style="visibility:hidden"'}>${nx?nm(nx):''} ${t('next')}</button></div>`;
if(tab==4)startSim(d);window.MathJax&&MathJax.typesetPromise&&MathJax.typesetPromise()}
function setLang(l){L=l;try{localStorage.setItem('pcvL',l)}catch(e){}$('root').lang=L;$('root').dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('#sg button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));document.querySelector('.brand').innerHTML='PCV <b>'+t('brand')+'</b>';render()}
let ren,scn,cam,ctl,mixer,model,raf,cur,mats=[],clock=null;
function simHTML(d){const ins=FM[d.fam].i(d.p);return`<div class="sim"><div id="view"><div id="cv"></div><div id="msg"></div><button class="edit" onclick="$('ed').classList.toggle('open')">${t('edit')}</button>
<div id="ed"><h5>${t('bg')}</h5><div class="sw">${BG.map(c=>`<i style="background:${c}" onclick="setBg('${c}')"></i>`).join('')}</div><h5>${t('mdl')}</h5><div class="sw">${MC.map(c=>`<i style="background:${c}" onclick="setMc('${c}')"></i>`).join('')}</div><h5>${t('op')}</h5><input type="range" min=".1" max="1" step=".05" value="1" oninput="setOp(this.value)"><button class="rs" onclick="setMc(null)">${t('reset')}</button></div></div>
<div><div class="box"><h5>${t('ctl')}</h5>${ins.map((x,i)=>`<div class="in"><div><label>${tr(x[0])} ${x[1]?'('+un(x[1])+')':''}</label><input type="number" id="n${i}" value="${x[4]}" step="${x[5]}" oninput="sy(${i},'n')"></div><input type="range" id="s${i}" min="${x[2]}" max="${x[3]}" step="${x[5]}" value="${x[4]}" oninput="sy(${i},'s')"></div>`).join('')}<div class="o" id="wn"><b class="w"></b></div></div>
<div class="box"><h5>${t('res')}</h5><div id="out"></div></div><div class="box"><h5>${t('file')}</h5><code>${d.file}</code></div></div></div>`}
function sy(i,s){const n=$('n'+i),r=$('s'+i);if(s==='n')r.value=n.value;else n.value=r.value;calc()}
function calc(){const d=cur,f=FM[d.fam],ins=f.i(d.p),v=ins.map((_,i)=>parseFloat($('n'+i).value)||0);
$('out').innerHTML=f.f(v,d.p).map(r=>`<div class="o"><span>${tr(r[0])}</span><b>${typeof r[1]==='number'?r[1].toFixed(2):tr(r[1])} ${un(r[2])}</b></div>`).join('');const w=f.w(v,d.p);$('wn').firstChild.textContent=w?'⚠ '+tr(w):'';
if(mixer)mixer.timeScale=(d.fam==='affinity'||d.fam==='pd')?Math.max(v[0]/ins[0][4],.05):1}
function startSim(d){cur=d;clock=new THREE.Clock();const c=$('cv');scn=new THREE.Scene();scn.background=new THREE.Color('#000');cam=new THREE.PerspectiveCamera(45,c.clientWidth/c.clientHeight,.1,200);cam.position.set(-3,2,4);
ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(c.clientWidth,c.clientHeight);ren.outputEncoding=THREE.sRGBEncoding;c.appendChild(ren.domElement);ctl=new THREE.OrbitControls(cam,ren.domElement);ctl.enableDamping=true;
scn.add(new THREE.AmbientLight(0xffffff,1.4));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(5,10,5);scn.add(dl);calc();$('msg').textContent='…'+d.file;
new THREE.GLTFLoader().load(d.file,g=>{model=g.scene;const b=new THREE.Box3().setFromObject(model),s=b.getSize(new THREE.Vector3()),m=Math.max(s.x,s.y,s.z)||1,k=3/m;model.scale.setScalar(k);model.position.sub(b.getCenter(new THREE.Vector3()).multiplyScalar(k));scn.add(model);mats=[];
model.traverse(o=>{if(o.isMesh)(Array.isArray(o.material)?o.material:[o.material]).forEach(x=>{x.userData.c=x.color&&x.color.clone();x.userData.o=x.opacity;x.userData.t=x.transparent;mats.push(x)})});
if(g.animations.length){mixer=new THREE.AnimationMixer(model);g.animations.forEach(a=>mixer.clipAction(a).play())}$('msg').textContent='';calc()},undefined,()=>{$('msg').innerHTML=`${t('need')}<br><code>${d.file}</code>`});
const loop=()=>{raf=requestAnimationFrame(loop);ctl.update();if(mixer)mixer.update(clock.getDelta());ren.render(scn,cam)};loop()}
function stopSim(){cancelAnimationFrame(raf);if(ren){ren.dispose();ren=null}mixer=null;model=null}
const setBg=c=>scn.background=new THREE.Color(c);
const setMc=c=>mats.forEach(m=>{if(!m.color)return;c?m.color.set(c):m.color.copy(m.userData.c)});
const setOp=v=>mats.forEach(m=>{if(m.userData.o===undefined)return;m.transparent=v<1||m.userData.t;m.opacity=Math.min(v,m.userData.o);m.needsUpdate=true});
window.onresize=()=>{if(ren){const c=$('cv');cam.aspect=c.clientWidth/c.clientHeight;cam.updateProjectionMatrix();ren.setSize(c.clientWidth,c.clientHeight)}};
let sv='en';try{sv=localStorage.getItem('pcvL')||((navigator.language||'').startsWith('ar')?'ar':'en')}catch(e){}setLang(sv);
</script></body></html>
